<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">Falcon architecture</title>
<desc id="desc">Detect lane: Cloud Audit Logs flow through a log sink and Pub/Sub into a Go pipeline on Cloud Run, which normalizes events, runs YAML detection rules, writes to BigQuery and sends matches to Slack; malformed messages go to a dead-letter topic. Triage lane: Dependabot and code-scanning alerts, EPSS and CISA KEV intel and CODEOWNERS feed a TypeScript triager that manages GitHub issues and a CI gate.</desc>
<style>
svg{--bg:#ffffff;--card:#f6f8fa;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--accent:#0969da;--alert:#cf222e;
--ok:#1a7f37;--warn:#9a6700;--code:#eef1f4;--chip:#ddf4ff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--card:#151b23;--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;
--accent:#4493f8;--alert:#f85149;--ok:#3fb950;--warn:#d29922;--code:#1f2630;--chip:#0c2d6b}}
text{white-space:pre;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink);font-size:12px}
.bg{fill:var(--bg);stroke:var(--line)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.code{fill:var(--code)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:11px}
.h1{font-size:15px;font-weight:600}
.ct{font-size:13px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.muted{fill:var(--muted)}
.accent{fill:var(--accent)}
.alert{fill:var(--alert)}
.ok{fill:var(--ok)}
.warn{fill:var(--warn)}
.b{font-weight:600}
.num{fill:var(--accent)}
.numt{fill:#fff;font-size:11px;font-weight:700}
.line{stroke:var(--line);stroke-width:1.5;fill:none}
.flow{stroke:var(--muted);stroke-width:1.5;fill:none}
.dash{stroke-dasharray:4 4}
.chipbg{fill:var(--chip)}
.alertbg{fill:var(--alert)}
.okbg{fill:var(--ok)}
.warnbg{fill:var(--warn)}
.accentbg{fill:var(--accent)}
.mutedbg{fill:var(--line)}
.bar{transform-box:fill-box;transform-origin:left center}
.ah{fill:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.packet{display:none}}
.packet{}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="429" rx="12" class="bg"/>
<text x="24" y="32" class="h1 accent">1 · DETECT</text>
<text x="112" y="32" class="sub">cloud attacks, streamed in real time</text>
<path d="M150,90 H185" class="flow" marker-end="url(#arrow)"/>
<path d="M295,90 H330" class="flow" marker-end="url(#arrow)"/>
<path d="M450,90 H488" class="flow" marker-end="url(#arrow)"/>
<path d="M702,78 C730,78 730,70 758,70" class="flow" marker-end="url(#arrow)"/>
<path d="M702,104 C730,104 730,134 758,134" class="flow" marker-end="url(#arrow)"/>
<path d="M390,112 V160" class="flow dash" marker-end="url(#arrow)"/>
<path d="M595,170 V134" class="flow dash" marker-end="url(#arrow)"/>
<rect x="20" y="64" width="130" height="52" rx="8" class="card"/>
<text x="85.0" y="88.0" class="b" text-anchor="middle">Cloud Audit Logs</text>
<text x="85.0" y="104.0" class="sub" text-anchor="middle">every GCP API call</text>
<rect x="185" y="64" width="110" height="52" rx="8" class="card"/>
<text x="240.0" y="88.0" class="b" text-anchor="middle">Log sink</text>
<text x="240.0" y="104.0" class="sub" text-anchor="middle">audit filter</text>
<rect x="330" y="64" width="120" height="52" rx="8" class="card"/>
<text x="390.0" y="88.0" class="b" text-anchor="middle">Pub/Sub</text>
<text x="390.0" y="104.0" class="sub" text-anchor="middle">push · OIDC auth</text>
<rect x="330" y="162" width="120" height="46" rx="8" class="card"/>
<text x="390.0" y="183.0" class="b" text-anchor="middle">Dead-letter</text>
<text x="390.0" y="199.0" class="sub" text-anchor="middle">after 5 failures</text>
<rect x="488" y="46" width="214" height="88" rx="8" class="card"/>
<text x="595" y="66" class="b" text-anchor="middle">Cloud Run · Go pipeline</text>
<text x="595" y="82" class="sub" text-anchor="middle">internal ingress only</text>
<rect x="500" y="96" width="58" height="26" rx="13" class="chipbg"/>
<text x="529" y="113" text-anchor="middle">normalize</text>
<rect x="566" y="96" width="58" height="26" rx="13" class="chipbg detectchip"/>
<text x="595" y="113" text-anchor="middle">detect</text>
<rect x="632" y="96" width="58" height="26" rx="13" class="chipbg"/>
<text x="661" y="113" text-anchor="middle">sink</text>
<rect x="488" y="172" width="214" height="46" rx="8" class="card" stroke-dasharray="5 4"/>
<text x="595" y="191" class="b mono" text-anchor="middle">detections/*.yaml</text>
<text x="595" y="207" class="sub" text-anchor="middle">tested in CI · baked into the image</text>
<rect x="758" y="46" width="182" height="50" rx="8" class="card"/>
<text x="849.0" y="69.0" class="b" text-anchor="middle">BigQuery</text>
<text x="849.0" y="85.0" class="sub" text-anchor="middle">events · alerts · deadletter</text>
<rect x="758" y="110" width="182" height="50" rx="8" class="card slack"/>
<text x="849" y="132" class="b" text-anchor="middle">Slack</text>
<text x="849" y="148" class="sub" text-anchor="middle">alert → on-call human</text>
<circle r="4.5" class="packet accentbg" visibility="hidden"><set attributeName="visibility" to="visible" begin="0.00s"/><animateMotion dur="5s" begin="0.00s" repeatCount="indefinite" path="M150,90 H702 C730,90 730,70 758,70"/></circle>
