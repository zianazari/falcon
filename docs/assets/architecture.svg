<circle r="4.5" class="packet accentbg" visibility="hidden"><set attributeName="visibility" to="visible" begin="2.49s"/><animateMotion dur="5s" begin="2.49s" repeatCount="indefinite" path="M150,90 H702 C730,90 730,70 758,70"/></circle>
