<circle r="4.5" class="packet accentbg" visibility="hidden"><set attributeName="visibility" to="visible" begin="4.15s"/><animateMotion dur="5s" begin="4.15s" repeatCount="indefinite" path="M150,90 H702 C730,90 730,70 758,70"/></circle>
<circle r="6" class="packet alertbg" visibility="hidden"><set attributeName="visibility" to="visible" begin="1s"/><animateMotion dur="8s" begin="1s" repeatCount="indefinite" path="M150,90 H702 C730,90 730,134 758,134" keyPoints="0;1;1" keyTimes="0;0.55;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" begin="1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.55;0.57;1"/></circle>
<rect x="500" y="96" width="58" height="26" rx="13" transform="translate(66 0)" class="packet alertbg" opacity="0"><animate attributeName="opacity" dur="8s" begin="1s" repeatCount="indefinite" values="0;0;.85;.85;0;0" keyTimes="0;0.36;0.38;0.46;0.48;1"/></rect>
<text x="595" y="113" text-anchor="middle" class="packet" opacity="0" style="fill:#fff;font-weight:600">MATCH<animate attributeName="opacity" dur="8s" begin="1s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.36;0.38;0.46;0.48;1"/></text>
<rect x="758" y="110" width="182" height="50" rx="8" class="packet" opacity="0" style="fill:none;stroke:var(--alert);stroke-width:3"><animate attributeName="opacity" dur="8s" begin="1s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.54;0.56;0.8;1"/></rect>
<circle r="5" class="packet warnbg" visibility="hidden"><set attributeName="visibility" to="visible" begin="5s"/><animateMotion dur="8s" begin="5s" repeatCount="indefinite" path="M150,90 H390 V185" keyPoints="0;1;1" keyTimes="0;0.35;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" begin="5s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.35;0.4;1"/></circle>
<circle cx="30" cy="232" r="5" class="accentbg"/>
