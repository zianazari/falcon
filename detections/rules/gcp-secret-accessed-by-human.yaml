id: gcp-secret-accessed-by-human
title: Secret read by a human user
description: >
  A human account read a Secret Manager secret value. Workloads read secrets
  through service accounts; a person doing it is unusual and may indicate a
  compromised account harvesting credentials.
  Requires DATA_READ audit logs for secretmanager.googleapis.com (enabled by Terraform).
severity: medium
mitre: [T1555]
runbook: docs/runbooks.md#gcp-secret-accessed-by-human
match:
  all:
    - field: action
      equals: google.cloud.secretmanager.v1.SecretManagerService.AccessSecretVersion
    - field: actor_type
      equals: user
    - field: outcome
      equals: success
